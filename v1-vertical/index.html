function resize(){
  const area=document.getElementById('area');const r=area.getBoundingClientRect();
  const dpr=window.devicePixelRatio||1;
  let k=Math.floor(Math.min(r.width*dpr/W,r.height*dpr/H));

  K=k;cv.width=Math.round(W*k);cv.height=Math.round(H*k);
  cv.style.width=(W*k/dpr)+'px';cv.style.height=(H*k/dpr)+'px';
}

/* ================= 音效（WebAudio 程序化，原創） ================= */
const S={state:'title',paused:false,muted:localStorage.getItem('yl_mute')==='1',touch:matchMedia('(pointer:coarse)').matches||('ontouchstart' in window),t:0,focus:0,bot:QS.get('bot')==='1'};
let AC=null,MG=null,bgmTimer=null,bgmStep=0,bgmNext=0;
function audioInit(){
  if(AC){if(AC.state==='suspended')AC.resume();return;}
  try{AC=new (window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.gain.value=S.muted?0:0.45;MG.connect(AC.destination);}catch(e){AC=null;}
}
function setMute(m){S.muted=m;localStorage.setItem('yl_mute',m?'1':'0');if(MG)MG.gain.value=m?0:0.45;}
function tone(f,d,type,vol,slide,delay){if(!AC||S.muted)return;const t=AC.currentTime+(delay||0);const o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),t+d);g.gain.setValueAtTime(vol||.12,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(MG);o.start(t);o.stop(t+d+.03);}
function noise(d,vol,delay){if(!AC||S.muted)return;const t=AC.currentTime+(delay||0);const n=Math.floor(AC.sampleRate*d);const b=AC.createBuffer(1,n,AC.sampleRate);const a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);const s=AC.createBufferSource();s.buffer=b;const g=AC.createGain();g.gain.value=vol||.15;s.connect(g);g.connect(MG);s.start(t);}

  wave:()=>tone(330,.18,'triangle',.12,500),
  dash:()=>tone(220,.25,'sawtooth',.06,500),

const mf=m=>440*Math.pow(2,(m-69)/12);
function bgmTick(){
  if(!AC||S.muted||S.state!=='play'||S.paused)return;
  const spb=60/132/2;
  if(bgmNext<AC.currentTime)bgmNext=AC.currentTime+.05;
  while(bgmNext<AC.currentTime+.25){
    const d=bgmNext-AC.currentTime,i=bgmStep%32;
    if(MEL[i])tone(mf(MEL[i]),spb*.9,'square',.035,0,d);
    if(BAS[i])tone(mf(BAS[i]),spb*1.6,'triangle',.07,0,d);
    if(i%4===2)noise(.03,.03,d);
    bgmStep++;bgmNext+=spb;
  }
}
bgmTimer=setInterval(bgmTick,80);

const laneX=(l,wy)=>l.x0+(l.x1-l.x0)*clamp((wy-l.y0)/(l.y1-l.y0),0,1);
function buildLevel(){
  const r=rng(20261011);
  const L={lanes:[],bubbles:[],obst:[],fakes:[],items:[],lights:[],cross:[],smokes:[],events:[]};

    .forEach(([y0,y1,x0,x1])=>L.lanes.push({y0,y1,x0,x1,w:22}));
  const busy=y=>L.cross.some(c=>Math.abs(c.wy-y)<40)||y>END-120;
  L.cross.push({wy:4150,state:'wait',t:0,peds:[0,1,2].map(i=>({x:10-i*9,s:i}))},{wy:4500,state:'wait',t:0,peds:[0,1,3].map(i=>({x:10-i*9,s:i}))});
  // 洋流帶上的泡泡
  for(const l of L.lanes)for(let y=l.y0+16;y<l.y1-8;y+=30)if(!busy(y))L.bubbles.push({wy:y,x:laneX(l,y),g:0});
  // 散落泡泡
  for(let y=110;y<END-140;y+=64){if(busy(y)||r()<.25)continue;const x=40+r()*100,n=1+Math.floor(r()*3);for(let i=0;i<n;i++)L.bubbles.push({wy:y+i*13,x:x+(r()-.5)*6,g:0});}
  [600,1450,2300,3100,3750,4380].forEach((y,i)=>L.bubbles.push({wy:y,x:[120,50,130,60,128,64][i],g:1}));
  // 三角錐（中性障礙）
  for(let y=300;y<END-160;y+=125+r()*70){if(busy(y))continue;const lane=L.lanes.find(l=>y>=l.y0&&y<=l.y1);const x=lane&&r()<.5?laneX(lane,y)+(r()<.5?-3:3):40+r()*100;L.obst.push({t:'cone',wy:y,x,hit:0});}
  // 違停小貨車（靠岸邊）
  for(let y=2250;y<3900;y+=260+r()*120){if(busy(y))continue;L.obst.push({t:'truck',wy:y,x:r()<.5?42:138,hit:0});}
  // 假訊息泡泡
  for(let y=2600;y<END-150;y+=95+r()*50){if(busy(y))continue;L.fakes.push({wy:y,x:45+r()*90,vx:(r()<.5?-1:1)*(8+r()*10),dead:0});}
  // 道具
  L.items.push({t:'bottle',wy:1500,x:90},{t:'cane',wy:1960,x:90},{t:'bottle',wy:3560,x:76});
  // 五座政見燈塔
  [960,1780,2600,3300,4320].forEach((y,i)=>L.lights.push({wy:y,x:i%2?140:40,lit:0,i}));
  // 鞭炮煙霧
  [3480,3640,3800].forEach((y,i)=>L.smokes.push({wy:y,x:[70,110,80][i],w:46,hit:0}));
  // 教學／劇情事件（依距離觸發）
  const kb=(a,b)=>({kb:a,tc:b});
  L.events=[
    [10,'dlg','沈伯洋','先別急著衝，跟著橘色的流走，路自己會打開。'],
    [60,'hint',kb('← → 或 A D 移動，吃橘色「民意泡泡」','甲板左側左右拖曳移動，吃橘色「民意泡泡」')],
    [300,'hint',kb('進入橘色洋流帶：加速＋累積洋流能量','進入橘色洋流帶：加速＋累積洋流能量')],
    [620,'hint',kb('能量夠了就按住 ↑／W 衝刺，可撞開三角錐','往上滑或按住 B 衝刺，可撞開三角錐')],
    [860,'hint',kb('看到燈塔：按 Space 送出浪花點亮它','看到燈塔：按 A 送出浪花點亮它')],
    [1050,'zone'],

function newRun(){
  const L=buildLevel();
  G=Object.assign(L,{dist:0,time:0,px:90,hp:3,inv:0,energy:30,wave:START_WAVE,bub:0,gold:0,popped:0,lit:0,badges:0,hits:0,
    dashing:false,slow:false,waveCD:0,rings:[],parts:[],toasts:[],dlg:null,haze:0,freeze:0,lastExit:-9,combo:0,inLane:false,
    cane:false,ended:false,endT:0,convoy:0,convoyOn:false,convoyHits:0,convoyEgg:false,zone:0,crew:String(Math.floor(Math.random()*90000)+10000),
    smokeHint:0,fakeHint:0,speed:40,posterEgg:false});
}
const inp={left:0,right:0,up:0,down:0};
const tch={drag:null,dash:false,slow:false,bDown:null};
function toast(text,kind,dur){G.toasts.push({text,kind:kind||'info',t:0,dur:dur||2.6});}
function hint(o){toast(S.touch?o.tc:o.kb,'hint',3.2);}
function dialog(who,text,dur){G.dlg={who,text,t:0,dur:dur||Math.max(3.2,text.length*.16)};}
function burst(x,y,col,n,sp){for(let i=0;i<(n||8);i++){const a=Math.random()*Math.PI*2,v=(sp||40)*(.4+Math.random()*.8);G.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,t:0,life:.4+Math.random()*.3,col});}}
function addWave(v){G.wave=clamp(G.wave+v,START_WAVE,1000);if(v>0)G.waveFlash=.25;}
const sy=wy=>PY-(wy-G.dist);   // 世界 → 螢幕 y

/* ================= 更新 ================= */
function fire(){
  if(G.waveCD>0||G.ended)return;G.waveCD=.38;
  G.rings.push({x:G.px,y:PY-12,r:2,max:G.cane?50:32,t:0,hitSet:new Set()});SFX.wave();
}
function update(dt){
  S.t+=dt;
  if(S.state!=='play'||S.paused)return;
  if(S.bot)botInput();
  G.time+=G.ended?0:dt;
  G.waveCD=Math.max(0,G.waveCD-dt);G.waveFlash=Math.max(0,(G.waveFlash||0)-dt);G.inv=Math.max(0,G.inv-dt);G.haze=Math.max(0,G.haze-dt);
  // 移動
  const dir=(inp.right?1:0)-(inp.left?1:0);
  if(!G.ended&&G.freeze<=0)G.px+=dir*78*dt;
  G.px=clamp(G.px,37,143);
  G.slow=!!(inp.down||tch.slow);
  const wantDash=!!(inp.up||tch.dash)&&!G.slow;
  if(wantDash&&!G.dashing&&G.energy>=30&&!G.ended){G.dashing=true;SFX.dash();}
  if(G.dashing&&(!wantDash||G.energy<=0))G.dashing=false;
  // 洋流帶
  const was=G.inLane;
  G.inLane=G.lanes.some(l=>G.dist>=l.y0&&G.dist<=l.y1&&Math.abs(laneX(l,G.dist)-G.px)<l.w/2+3);
  if(G.inLane&&!was){G.combo=(G.time-G.lastExit<1.5)?Math.min(3,G.combo+1):0;if(G.combo>0)toast('順流連擊 ×'+[1,1.2,1.5,2][G.combo],'combo',1.2);}
  if(!G.inLane&&was)G.lastExit=G.time;
  if(G.inLane)G.energy=Math.min(100,G.energy+12*dt);
  if(G.dashing)G.energy=Math.max(0,G.energy-25*dt);
  // 速度
  let sp=44*(G.dashing?2.2:G.inLane?1.5:1);
  if(G.slow)sp*=.35;
  // 斑馬線
  for(const c of G.cross){
    const rel=c.wy-G.dist;
    if(c.state==='wait'&&rel<70&&rel>0)c.active=true;
    if(c.state==='wait'&&G.slow&&rel<=26&&rel>0){c.state='cross';c.t=0;}
    if(c.state==='cross'){sp=0;c.t+=dt;c.peds.forEach(p=>p.x+=34*dt);if(c.peds.every(p=>p.x>168)){c.state='done';G.badges++;addWave(6);SFX.badge();toast('獲得「禮讓徽章」！謝謝你讓行人先走','badge',2.6);}}
    if(c.state==='wait'&&rel<=0){c.state='shake';c.t=0;toast('行人停下來搖搖頭……下次記得禮讓喔','info',2.4);}
    if(c.state==='shake')c.t+=dt;
  }
  if(G.freeze>0){G.freeze-=dt;sp=0;}
  // 終點
  if(G.ended){sp=0;G.endT+=dt;G.px+=(90-G.px)*Math.min(1,dt*2);if(G.endT>4.2&&S.state==='play'){S.state='clear';S.focus=0;SFX.clear();}}
  G.speed=sp;
  G.dist+=sp*dt;
  if(!G.ended&&G.dist>=END){G.dist=END;G.ended=true;G.dashing=false;G.toasts=[];
    dialog('沈伯洋','剛剛車多、鞭炮也吵，打擾到街坊，真的抱歉。下次我們安靜一點地航行。',4.2);}
  // 泡泡
  const mult=[1,1.2,1.5,2][G.combo]||1;
  for(const b of G.bubbles){if(b.got)continue;const dy=b.wy-G.dist;if(dy<-20)continue;if(dy>20)continue;
    if(Math.abs(b.x-G.px)<(b.g?10:9)&&Math.abs(dy+2)<10){b.got=1;if(b.g){G.gold++;addWave(6*mult);SFX.gold();burst(b.x,sy(b.wy),'y',12);}else{G.bub++;addWave(.9*mult);SFX.bubble();burst(b.x,sy(b.wy),'l',5,25);}}}
  // 假訊息
  for(const f of G.fakes){if(f.dead)continue;const dy=f.wy-G.dist;if(dy>200||dy<-100)continue;
    f.x+=f.vx*dt;if(f.x<40||f.x>140)f.vx*=-1;f.x=clamp(f.x,40,140);
    if(Math.abs(f.x-G.px)<10&&Math.abs(dy+2)<10&&!G.ended){f.dead=1;addWave(-6);G.haze=Math.max(G.haze,.6);SFX.hit();burst(f.x,sy(f.wy),'p',10);
      if(G.fakeHint<2){G.fakeHint++;toast(S.touch?'被假訊息黏到了！按 A 浪花先戳破它':'被假訊息黏到了！按 Space 浪花先戳破它','warn',2.4);}}}
  // 障礙
  for(const o of G.obst){if(o.hit)continue;const dy=o.wy-G.dist;if(dy>20||dy<-30)continue;
    const hw=o.t==='truck'?7:4,hh=o.t==='truck'?8:4;
    if(Math.abs(o.x-G.px)<hw+5&&Math.abs(dy)<hh+5){
      if(o.t==='cone'&&G.dashing){o.hit=2;burst(o.x,sy(o.wy),'o',8);SFX.pop();continue;}
      if(G.inv>0)continue;
      o.hit=1;damage();}}
  // 道具
  for(const it of G.items){if(it.got)continue;const dy=it.wy-G.dist;if(Math.abs(dy)<10&&Math.abs(it.x-G.px)<11){it.got=1;SFX.item();
    if(it.t==='bottle'){G.hp=Math.min(3,G.hp+1);toast('洋流補給：救生圈 +1','item',2);}
    else{G.cane=true;burst(G.px,PY,'g',14);toast('甘蔗寶刀到手！步步高升：浪花範圍變大','item',3);dialog('粉撲','對，甘蔗要站著放！這樣才會步步高升！',3.4);}}}
  // 燈塔（浪花點亮或近距離通過）
  for(const lt of G.lights){if(lt.lit)continue;const dy=lt.wy-G.dist;
    if(dy<4&&dy>-8&&Math.abs(lt.x-G.px)<34)lightUp(lt,false);
    else if(dy<-8&&!lt.missed){lt.missed=1;toast('錯過燈塔了！下一座記得靠近或用浪花','info',2);}}
  // 煙霧
  for(const s of G.smokes){const dy=s.wy-G.dist;if(s.hit||Math.abs(dy)>10)continue;if(Math.abs(s.x-G.px)<s.w/2){s.hit=1;
    if(G.slow){toast('慢慢過，沒事～','good',1.6);addWave(2);}else{G.haze=1.8;SFX.hit();if(G.smokeHint++<2)toast(S.touch?'看不清楚！往下滑減速再過':'看不清楚！按住 ↓ 減速再過','warn',2);}}}
  // 浪花
  for(const r of G.rings){r.t+=dt;r.r=2+(r.max-2)*Math.min(1,r.t/.28);
    for(const f of G.fakes){if(f.dead)continue;const d=Math.hypot(f.x-r.x,sy(f.wy)-r.y);if(d<r.r+6){f.dead=1;G.popped++;addWave(3);SFX.pop();burst(f.x,sy(f.wy),'p',10);burst(f.x,sy(f.wy),'W',6);}}
    for(const lt of G.lights){if(lt.lit)continue;const d=Math.hypot(lt.x-r.x,sy(lt.wy)-8-r.y);if(d<r.r+10)lightUp(lt,true);}
    if(!G.posterEgg&&G.dist>2900&&G.dist<3300){const py=sy(3150);if(Math.hypot(18-r.x,py-r.y)<r.r+14){G.posterEgg=true;toast('寧夏第一張海報：「8 月中，一切從這裡開始」','egg',3);SFX.item();}}
  }
  G.rings=G.rings.filter(r=>r.t<.34);
  // 機車隊
  if(G.convoyOn)G.convoy=Math.min(2000,Math.round(G.convoy+dt*190));
  // 事件
  for(const e of G.events){if(e.done||G.dist<e.d)continue;e.done=1;
    if(e.type==='dlg')dialog(e.a,e.b);
    else if(e.type==='hint')hint(e.a);
    else if(e.type==='note')toast(e.a,'note',3);
    else if(e.type==='zone'){G.zone=zoneAt(e.d);toast('進入　'+ZONES[G.zone][1],'zone',2);}
    else if(e.type==='convoy'){G.convoyOn=true;G.convoy=1;G.convoyHits=G.hits;toast('機車隊集結！跟隨船員持續增加中','info',2.4);}
    else if(e.type==='convoyEnd'){G.convoy=2000;if(G.hits===G.convoyHits){G.convoyEgg=true;toast('零碰撞！解鎖「機車隊船身」（彩蛋）','egg',2.8);}}
  }
  // 粒子／提示
  for(const p of G.parts){p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=30*dt;}
  G.parts=G.parts.filter(p=>p.t<p.life);
  if(G.toasts.length){const t=G.toasts[0];t.t+=dt*(G.toasts.length>2?1.8:1);if(t.t>t.dur)G.toasts.shift();}
  if(G.dlg){G.dlg.t+=dt;if(G.dlg.t>G.dlg.dur)G.dlg=null;}
}
function lightUp(lt,byWave){lt.lit=1;G.lit++;addWave(byWave?12:8);SFX.light();burst(lt.x,sy(lt.wy)-10,'l',16,50);
  toast('政見燈塔 '+G.lit+'/5｜'+POLICIES[lt.i],'policy',3);}
function damage(){
  G.hits++;G.hp--;G.inv=1.3;SFX.hit();burst(G.px,PY,'R',10);
  if(G.hp<=0){G.hp=3;G.inv=3;G.freeze=2;toast('救生圈用完了！粉撲們把你拉回航道，休息 2 秒','warn',2.4);}
}

/* ================= 自動駕駛（僅測試用：?bot=1） ================= */
function botInput(){
  const g=G;let target=90;inp.left=inp.right=inp.up=inp.down=0;
  const lane=g.lanes.find(l=>g.dist+40>=l.y0&&g.dist<=l.y1-10);
  if(lane)target=laneX(lane,Math.max(g.dist+10,lane.y0));
  else{const b=g.bubbles.filter(b=>!b.got&&b.wy-g.dist>5&&b.wy-g.dist<90).sort((a,b)=>a.wy-b.wy)[0];if(b)target=b.x;}
  for(const o of g.obst){const d=o.wy-g.dist;if(o.hit||d<0||d>60)continue;if(o.t==='cone'&&g.dashing)continue;const hw=o.t==='truck'?16:12;if(Math.abs(o.x-target)<hw)target=o.x+(o.x<90?hw+4:-hw-4);}
  const unlit=g.lights.find(l=>!l.lit&&l.wy-g.dist>0&&l.wy-g.dist<120);if(unlit)target=unlit.x<90?50:130;
  if(target<g.px-2)inp.left=1;if(target>g.px+2)inp.right=1;
  if(g.energy>55&&!g.obst.some(o=>o.t==='truck'&&!o.hit&&o.wy-g.dist>0&&o.wy-g.dist<80))inp.up=1;
  if(g.fakes.some(f=>!f.dead&&f.wy-g.dist>0&&f.wy-g.dist<45&&Math.abs(f.x-g.px)<40))fire();
  if(unlit&&unlit.wy-g.dist<50)fire();
  if(g.cross.some(c=>c.state==='wait'&&c.wy-g.dist<60&&c.wy-g.dist>0)||g.cross.some(c=>c.state==='cross'))inp.down=1,inp.up=0;
  if(g.smokes.some(s=>!s.hit&&s.wy-g.dist<30&&s.wy-g.dist>-5))inp.down=1,inp.up=0;
}

/* ================= 繪圖：場景 ================= */
function nightAt(wy){return clamp((wy-2850)/350,0,1);}
function drawScene(){
  const b=bx,d=Math.floor(G.dist),T=S.t;
  const night=nightAt(G.dist);
  // 水面
  R(b,30,0,120,GH,'b');
  for(let row=-4;row<GH+8;row+=4){const wy=Math.floor((d+PY-row)/4);const y=PY-(wy*4-d);if(y<-4||y>GH)continue;
    const h1=hash(wy,7);if(h1<.55){const x=31+Math.floor(hash(wy,3)*112);R(b,x,y,h1<.2?5:3,1,h1<.3?'c':'D');}}
  // 河岸（12px 圖塊）
  const i0=Math.floor((d-(GH-PY)-12)/12),i1=Math.floor((d+PY+12)/12);
  const lights=[];
  for(let i=i0;i<=i1;i++){const wy=i*12,y=Math.round(PY-(wy+12-d));if(y>GH)continue;const z=zoneAt(wy);
    drawBank(b,0,y,i,z,lights,T);drawBank(b,1,y,i,z,lights,T);
    if(wy>END+20){R(b,30,y,120,12,'y');R(b,30,y,120,1,'l');for(let x=30;x<150;x+=12)R(b,x,y,1,12,'l');}
    else{for(let k=0;k<12;k+=3){R(b,30,y+k,1,2,'w');R(b,149,y+k+1,1,2,'w');}}
  }
  // 保安宮
  drawTemple(b,Math.round(PY-(END+84-d)),lights,T);
  // 夜色
  if(night>0){b.fillStyle='rgba(27,27,47,'+(night*.5)+')';b.fillRect(0,0,W,GH);}
  for(const L of lights){b.fillStyle='rgba(255,179,71,'+(.18+.5*night)*.5+')';b.fillRect(L[0]-2,L[1]-2,5,5);R(b,L[0],L[1],1+(L[2]||0),1+(L[2]||0),L[3]||'l');}
  // 洋流帶
  for(const l of G.lanes){const yTop=sy(l.y1),yBot=sy(l.y0);if(yBot<0||yTop>GH)continue;
    for(let y=Math.max(0,Math.floor(yTop));y<Math.min(GH,yBot);y+=2){const wy=G.dist+PY-y;const x=Math.round(laneX(l,wy)),hw=l.w/2;
      R(b,x-hw,y,l.w,2,'o');R(b,x-hw,y,2,2,'O');R(b,x+hw-2,y,2,2,'O');
      const ph=Math.floor(wy+T*60)%14;if(ph<2){R(b,x-4,y,3,1,'l');R(b,x+1,y,3,1,'l');}if(ph===2)R(b,x-1,y,2,1,'W');}}
  // 斑馬線
  for(const c of G.cross){const y=Math.round(sy(c.wy));if(y<-20||y>GH+20)continue;
    R(b,30,y-7,120,14,'G');for(let x=33;x<148;x+=8)R(b,x,y-6,5,12,'W');R(b,30,y+9,120,1,'W');
    for(const p of c.peds){let px=p.x<30?p.x+(c.state==='wait'?0:0):p.x;const bob=(c.state==='cross'&&Math.floor(T*8)%2)?1:0;
      const yy=y-12-bob;b.drawImage(SP.peds[p.s],Math.round(Math.min(px,170)),yy);
      if(c.state==='shake'&&c.t<3){R(b,Math.round(px)+(Math.floor(T*10)%2),yy-4,6,3,'W');}}
  }
  // 煙霧
  for(const s of G.smokes){const y=sy(s.wy);if(y<-30||y>GH+30)continue;
    for(let i=0;i<9;i++){const a=hash(i,s.wy);const r=4+Math.floor(a*5);const x=s.x-s.w/2+a*s.w,yy=y-8+hash(s.wy,i)*16+Math.sin(T*2+i)*2;
      b.fillStyle=i%3?'rgba(191,232,238,.55)':'rgba(138,133,128,.6)';b.fillRect(Math.round(x-r),Math.round(yy-r),r*2,r*2);}
    for(let i=0;i<5;i++)R(b,s.x-15+i*7+Math.sin(T*3+i)*2,y-5+((T*20+i*7)%14),1,2,'R');}
  // 道具
  for(const it of G.items){if(it.got)continue;const y=sy(it.wy);if(y<-20||y>GH)continue;const bob=Math.round(Math.sin(T*4)*1.5);
    if(it.t==='cane'){R(b,it.x-6,y-10+bob,13,1,'l');b.drawImage(SP.cane,Math.round(it.x-2),Math.round(y-9+bob));}
    else b.drawImage(SP.bottle,Math.round(it.x-3),Math.round(y-5+bob));}
  // 燈塔
  for(const lt of G.lights){const y=Math.round(sy(lt.wy));if(y<-30||y>GH+30)continue;
    if(lt.lit){const a=(Math.sin(T*3)+1)/2;b.fillStyle='rgba(255,200,110,'+(.28+.22*a)+')';const dir=lt.x<90?1:-1;b.beginPath();b.moveTo(lt.x,y-14);b.lineTo(lt.x+dir*60,y-34);b.lineTo(lt.x+dir*60,y-4);b.closePath();b.fill();}
    b.drawImage(lt.lit?SP.light1:SP.light0,lt.x-5,y-19);}
  // 障礙
  for(const o of G.obst){const y=Math.round(sy(o.wy));if(y<-30||y>GH+30||o.hit===2)continue;
    if(o.t==='cone')b.drawImage(SP.cone,Math.round(o.x-3),y-4);else b.drawImage(SP.truck,Math.round(o.x-7),y-8);}
  // 泡泡
  for(const bb of G.bubbles){if(bb.got)continue;const y=sy(bb.wy);if(y<-12||y>GH+6)continue;const bob=Math.round(Math.sin(T*3+bb.wy)*1);
    if(bb.g){b.drawImage(SP.gold,Math.round(bb.x-5),Math.round(y-5+bob));if(Math.floor(T*6+bb.wy)%6===0)R(b,bb.x+4,y-6,1,1,'W');}
    else b.drawImage(SP.bub,Math.round(bb.x-4),Math.round(y-4+bob));}
  for(const f of G.fakes){if(f.dead)continue;const y=sy(f.wy);if(y<-12||y>GH+6)continue;b.drawImage(SP.fake,Math.round(f.x-6),Math.round(y-6+Math.sin(T*5+f.wy)));}
  // 機車隊
  if(G.convoyOn||G.convoy>=2000){const fade=G.dist<2750?1:clamp(1-(G.dist-2750)/250,0,1);
    if(fade>0){const rows=Math.min(5,1+Math.floor(G.convoy/400));
      for(let rr=0;rr<rows;rr++)for(let c=0;c<6;c++){if((rr+c)%2)continue;const x=40+c*18+Math.sin(T*2+rr+c)*2,y=PY+18+rr*13+(1-fade)*80;if(y>GH)continue;b.drawImage(SP.scoots[(rr*3+c)%5],Math.round(x-5),Math.round(y));}}}
  // 玩家
  drawPlayer(b,T);
  // 浪花
  for(const r of G.rings){b.strokeStyle='rgba(191,232,238,'+(1-r.t/.34)+')';b.lineWidth=2;b.beginPath();b.arc(r.x,r.y,r.r,0,Math.PI*2);b.stroke();
    b.strokeStyle='rgba(255,244,224,'+(1-r.t/.34)*.8+')';b.lineWidth=1;b.beginPath();b.arc(r.x,r.y,Math.max(1,r.r-3),0,Math.PI*2);b.stroke();}
  for(const p of G.parts)R(b,p.x,p.y,1,1,p.col);
  if(G.haze>0){b.fillStyle='rgba(191,191,200,'+Math.min(.75,G.haze*.5)+')';b.fillRect(0,0,W,GH);}
}
function drawBank(b,side,y,i,z,lights,T){
  const x0=side?150:0,w=30,h=hash(i,side+11),h2=hash(i,side+29);
  if(z===0){ // 北投：綠地、溫泉白煙
    R(b,x0,y,w,12,'g');if(h<.3){R(b,x0+6+h*10,y+3,8,5,'c');R(b,x0+7+h*10,y+4,6,1,'w');for(let s=0;s<3;s++){const sy2=y+2-((T*10+s*5+i)%14);b.fillStyle='rgba(255,244,224,.55)';b.fillRect(Math.round(x0+8+h*10+s*2+Math.sin(T+s)*1.5),Math.round(sy2),2,2);}}
    else if(h<.7){R(b,x0+4+h2*16,y+1,8,7,'k');R(b,x0+5+h2*16,y+2,6,5,'g');R(b,x0+6+h2*16,y+2,3,2,'w');R(b,x0+7+h2*16,y+8,2,4,'n');}
    else R(b,x0+h2*24,y+6,4,3,'G');

  btn('重新開始本關',40,119,100,18,()=>{newRun();S.paused=false;});
  btn(S.muted?'音效：關':'音效：開',40,143,100,18,()=>setMute(!S.muted));
  btn(S.touch?'操作：觸控':'操作：鍵盤',40,167,100,18,()=>{S.touch=!S.touch;});
  btn('回標題',40,191,100,18,()=>{S.paused=false;go('title');});
}
function go(st){SFX.ui();S.focus=0;if(st==='crew'&&!G)newRun();if(st==='crew'&&G&&G.dist>0)newRun();if(st==='play'&&!G)newRun();if(st==='title')G=null;S.state=st;S.paused=false;}

/* ================= 輸入 ================= */
const KEYMAP={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down'};
window.addEventListener('keydown',e=>{
  audioInit();
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code))e.preventDefault();
  if(S.touch&&!e.repeat&&S.state!=='play')S.touch=false;
  if(e.code==='KeyM'){setMute(!S.muted);return;}
  const menu=S.state!=='play'||S.paused;
  if(menu){
    if(e.repeat)return;
    if(e.code==='ArrowDown'||e.code==='KeyS'||e.code==='Tab'){e.preventDefault();S.focus=(S.focus+1)%Math.max(1,BTNS.filter(b=>b.fn&&b.h>=15).length);SFX.ui();}
    else if(e.code==='ArrowUp'||e.code==='KeyW'){const n=Math.max(1,BTNS.filter(b=>b.h>=15).length);S.focus=(S.focus-1+n)%n;SFX.ui();}
    else if(e.code==='Enter'||e.code==='Space'||e.code==='KeyJ'){const list=BTNS.filter(b=>b.h>=15);const bt=list[S.focus]||list[0];if(bt)bt.fn();}
    else if((e.code==='Escape'||e.code==='KeyP')&&S.paused)S.paused=false;
    else if(e.code==='KeyR'&&S.paused){newRun();S.paused=false;}
    return;
  }
  if(e.code==='Escape'||e.code==='KeyP'){S.paused=true;S.focus=0;return;}
  if(S.touch&&!e.repeat)S.touch=false;
  if(KEYMAP[e.code])inp[KEYMAP[e.code]]=1;
  if((e.code==='Space'||e.code==='KeyJ')&&!e.repeat)fire();
  if(e.code==='ShiftLeft'||e.code==='ShiftRight'||e.code==='KeyK')inp.up=1;
});
window.addEventListener('keyup',e=>{if(KEYMAP[e.code])inp[KEYMAP[e.code]]=0;if(e.code==='ShiftLeft'||e.code==='ShiftRight'||e.code==='KeyK')inp.up=0;});
window.addEventListener('blur',()=>{inp.left=inp.right=inp.up=inp.down=0;if(S.state==='play')S.paused=true;});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S.state==='play')S.paused=true;});
function gpos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};}
const ptrs=new Map();
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();audioInit();try{cv.setPointerCapture(e.pointerId);}catch(_){}
  if(e.pointerType==='touch'||e.pointerType==='pen')S.touch=true;
  const p=gpos(e);
  if(S.state!=='play'||S.paused){for(const b of BTNS)if(p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h){b.fn();return;}
    if(S.state==='title')go('howto');return;}
  if(p.y<17&&p.x>150){S.paused=true;return;}
  if(S.touch&&p.y>=GH&&p.x>=112){
    if(Math.hypot(p.x-135,p.y-293)<17||(p.x<148&&p.y>285)){fire();tch.aFlash=.15;ptrs.set(e.pointerId,{kind:'A'});return;}
    tch.dash=true;ptrs.set(e.pointerId,{kind:'B'});return;}
  // 拖曳區（甲板左側；遊戲區也可拖曳）
  ptrs.set(e.pointerId,{kind:'drag',sx:p.x,sy:p.y,lx:p.x,ly:p.y,ay:p.y,t0:performance.now()});tch.drag=ptrs.get(e.pointerId);
},{passive:false});
cv.addEventListener('pointermove',e=>{
  e.preventDefault();const d=ptrs.get(e.pointerId);if(!d||d.kind!=='drag'||!G)return;const p=gpos(e);
  G.px=clamp(G.px+(p.x-d.lx)*1.5,37,143);d.lx=p.x;
  const dy=p.y-d.ay;
  if(dy<-10){tch.dash=true;tch.slow=false;d.ay=p.y;}
  else if(dy>10){tch.slow=true;tch.dash=false;d.ay=p.y;}
},{passive:false});
function ptrEnd(e){const d=ptrs.get(e.pointerId);if(!d)return;ptrs.delete(e.pointerId);
  if(d.kind==='B')tch.dash=false;if(d.kind==='drag'){tch.drag=null;tch.dash=false;tch.slow=false;}}
cv.addEventListener('pointerup',ptrEnd);cv.addEventListener('pointercancel',ptrEnd);cv.addEventListener('lostpointercapture',ptrEnd);
['touchstart','touchmove','touchend','gesturestart','gesturechange','dblclick','contextmenu'].forEach(ev=>document.addEventListener(ev,e=>{if(e.cancelable)e.preventDefault();},{passive:false}));
document.addEventListener('wheel',e=>{if(e.ctrlKey)e.preventDefault();},{passive:false});

/* ================= 主迴圈 ================= */
let last=performance.now(),acc=0;const STEP=1/60;
function frame(now){
  let dt=(now-last)/1000;last=now;if(dt>.25)dt=.25;acc+=dt*(window.__yl.speed||1);
  while(acc>=STEP){update(STEP);acc-=STEP;if(tch.aFlash>0)tch.aFlash-=STEP;}
  render();requestAnimationFrame(frame);
}
window.__yl={get S(){return S;},get G(){return G;},speed:Number(QS.get('speed'))||1,go,newRun,fire,
  warp(d){if(!G)return;G.dist=d;for(const e of G.events)if(e.d<d)e.done=1;G.zone=zoneAt(d);},
  setBot(v){S.bot=v;}};
resize();cv.focus();requestAnimationFrame(frame);
})();
</script>

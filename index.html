function buildLevel(li){
  const LD=LV[li];
  const L={li,LD,bubbles:[],fakes:[],items:[],lights:[],cross:[],smokes:[],posters:[],events:[],zoneX:[],goal:0,
    npcs:[],needItems:[],stickers:[],fans:[],gates:[],cats:[],videos:[],shops:[],clouds:[],stalls:[],boards:[]};
  if(LD.special){ // 第 5 關：辯論擂台
    const NC=18,grid=[];for(let r=0;r<ROWS;r++)grid.push(new Array(NC).fill(r>=16?'#':'.'));
    [3,8,13].forEach(c=>grid[12][c]='A');
    Object.assign(L,{grid,NC,zoneX:[0],goal:99999});return L;}
  let NC=0;for(const s of LD.seq)NC+=TPL[s[0]][0].length;
  const grid=[];for(let r=0;r<ROWS;r++)grid.push(new Array(NC).fill('.'));
  L.grid=grid;L.NC=NC;let x0=0,ni=0;
  LD.seq.forEach(([name,zone,evs])=>{
    const t=TPL[name],w=t[0].length;
    if(L.zoneX.length<=zone){L.zoneX.push(x0*TS);if(zone>0)L.events.push({x:x0*TS,e:['zone',zone],done:0});}
    (evs||[]).forEach(e=>L.events.push({x:x0*TS,e,done:0}));
    for(let j=0;j<9;j++)for(let i=0;i<w;i++){const ch=(t[j][i]||'.'),r=8+j,c=x0+i,X=c*TS,Y=r*TS;
      if(SOLID.includes(ch))grid[r][c]=ch;
      else if(ch==='o'||ch==='g')L.bubbles.push({x:X+5,y:Y+5,g:ch==='g'});
      else if(ch==='f'||ch==='F')L.fakes.push({x:X,y:Y,w:10,h:10,vx:-14,fly:ch==='F',by:Y,bx:X,dead:0,tag:['震驚','轉傳','!!'][(c*7)%3]});
      else if(ch==='b')L.items.push({t:'bottle',x:X+5,y:Y+5});
      else if(ch==='L')L.lights.push({x:X+5,y:Y+TS,lit:0,i:L.lights.length});
      else if(ch==='Z')L.cross.push({x:X,w:50,state:'wait',t:0,peds:[0,1,2].map(i=>({s:i,d:-i*.45,p:0}))});
      else if(ch==='S')L.smokes.push({x:X,w:80,hit:0});
      else if(ch==='P')L.posters.push({x:X,y:Y-14,hit:0});
      else if(ch==='E')L.goal=X+5;
      else if(ch==='N'){const d=LD.npcs[ni++]||{need:'tea',who:'中間選民',ask:''};L.npcs.push(Object.assign({x:X+5,y:Y+TS,done:0,cd:0,asked:0,spr:(li===1?SP.youth:SP.voters)[(ni-1)%(li===1?3:6)]},d));}
      else if(ITEMK[ch])L.needItems.push({k:ITEMK[ch],x:X+5,y:Y+5});
      else if(ch==='H')L.fans.push({x:X+5,y:Y+TS});
      else if(ch==='x')L.stickers.push({x:X+5,y:Y+5,by:Y+5,t:c,dead:0});
      else if(ch==='M')L.gates.push({c,r0:12,r1:15,ph:(L.gates.length%2)*1.1,open:1});
      else if(ch==='D')L.cats.push({x:X+5,y:Y+TS,st:'sleep',t:0});
      else if(ch==='V')L.videos.push({x:X+5,y:Y+5,st:'fake'});
      else if(ch==='O')L.shops.push({x:X+5,y:Y+TS,done:0});
      else if(ch==='r')L.clouds.push({x:X+5,y:Y+5,by:Y+5,dead:0,t:c});
      else if(ch==='J')L.stalls.push({x:X+5,y:Y+TS,said:0});
      else if(ch==='Y')L.boards.push({x:X,y:Y});
    }
    x0+=w;
  });
  for(let c=0;c<NC;c++){const g=grid[16][c];if(SOLID.includes(g)&&g!=='c'&&g!=='t')for(let r=17;r<ROWS;r++)grid[r][c]='#';}
  return L;
}

function updBoss(dt){const B=G.boss,p=G.p;B.t+=dt;B.fl=Math.max(0,B.fl-dt);

let botJ=0;
function botInput(){
  const p=G.p;inp.left=0;inp.right=1;inp.dash=0;let jump=false;
  const fx=p.x+p.w,feet=p.y+p.h,pcx=p.x+4;
  const goTo=tx=>{inp.right=0;if(pcx<tx-2)inp.right=1;else if(pcx>tx+2)inp.left=1;return Math.abs(pcx-tx)<=3;};
  if(G.mode==='debate'){const d=G.deb;inp.right=0;
    if(d.ph==='ask'&&d.t>1.2){const at=goTo([35,85,135][QUIZ[d.q].best]);if(at&&p.onG&&Math.abs(p.vx)<20)jump=true;}}
  else if(G.mode==='boss'){const B=G.boss;inp.right=0;
    if(B.ready&&!B.done&&p.onG)fire();
    const it=B.items[0];if(it){const at=goTo(it.x);if(at&&it.y<140&&p.onG)jump=true;
      if(!at&&p.onG){const wall=solidAt(inp.right?fx+4:p.x-4,feet-3);if(wall)jump=true;}}
    for(const s of B.shots){if(s.x>pcx&&s.x-pcx<40){if(G.waveCD<=0){p.face=0;fire();}}if(Math.abs(s.x-pcx)<16&&p.onG)jump=true;}}
  else{
    for(const c of G.cross){if(c.state==='cross'&&fx>c.x-75&&fx<c.x-2)inp.right=0;}
    for(const gt of G.gates){const gx=gt.c*TS;if(!gt.open&&gx-fx>=-1&&gx-fx<20)inp.right=0;}
    const look=4+Math.abs(p.vx+p.boost)*.06;
    const wall=solidAt(fx+look,feet-3)||solidAt(fx+look,feet-11);
    const pit=p.onG&&!solidAt(fx+4,feet+4);
    const enemy=G.fakes.find(f=>!f.dead&&!f.fly&&f.x-fx>-4&&f.x-fx<34&&Math.abs(f.y-p.y)<16);
    if(enemy&&G.waveCD<=0)fire();
    const tgt=[...G.cats.filter(c=>c.st==='pop'),...G.videos.filter(v=>v.st==='fake'&&v.on)].find(o=>o.x-fx<70&&o.x>pcx);
    if(tgt&&G.waveCD<=0)fire();
    if(G.clouds.some(c=>!c.dead&&c.x-pcx>0&&c.x-pcx<60&&Math.abs(c.y-(p.y+6))<12)&&G.waveCD<=0)fire();
    let itemJump=false;const npc=G.npcs.find(n=>!n.done&&n.x>pcx-4);
    if(npc)for(const it of G.needItems){const dx=it.x-pcx;
      if(G.held!==npc.need&&it.k===npc.need&&it.y<140&&dx>-3&&dx<5&&p.onG)itemJump=true;
      if(it.k!==npc.need&&it.y>140&&dx>4&&dx<16&&p.onG)itemJump=true;}
    if(inp.right&&p.onG&&(wall||pit||(enemy&&enemy.x-fx<14)))jump=true;
    if(itemJump)jump=true;
  }
  if(jump&&botJ<=0){jumpPressed=true;botJ=.3;}
  if(botJ>0){botJ-=1/60;inp.jump=1;}else inp.jump=0;
}

/* ================= 輸入 ================= */
const KM={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',Space:'jump',ArrowUp:'jump',KeyW:'jump',KeyK:'jump',ShiftLeft:'dash',ShiftRight:'dash'};
window.addEventListener('keydown',e=>{
  audioInit();if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code))e.preventDefault();
  if(S.touch&&!e.repeat)S.touch=false;
  if(e.code==='KeyM'){setMute(!S.muted);return;}
  if(S.state==='cut'){if(!e.repeat&&CUT&&CUT.t>.4)endCut();return;}
  const menu=S.state!=='play'||S.paused;
  if(menu){if(e.repeat)return;const list=BTNS.filter(b=>b.h>=15);
    if(e.code==='ArrowDown'||e.code==='KeyS'||e.code==='Tab'){e.preventDefault();S.focus=(S.focus+1)%Math.max(1,list.length);SFX.ui();}
    else if(e.code==='ArrowUp'||e.code==='KeyW'){S.focus=(S.focus-1+list.length)%Math.max(1,list.length);SFX.ui();}
    else if(e.code==='Enter'||e.code==='Space'||e.code==='KeyJ'){const bt=list[S.focus]||list[0];if(bt)bt.fn();}
    else if((e.code==='Escape'||e.code==='KeyP')&&S.paused)S.paused=false;
    else if(e.code==='Escape'&&S.state==='select')go('title');
    return;}
  if(e.code==='Escape'||e.code==='KeyP'){S.paused=true;S.focus=0;return;}
  if(G&&G.mode==='debate'&&!e.repeat){const n={Digit1:0,Digit2:1,Digit3:2,Numpad1:0,Numpad2:1,Numpad3:2}[e.code];if(n!=null){answer(n);return;}}
  const k=KM[e.code];if(k){if(k==='jump'&&!inp.jump&&!e.repeat)jumpPressed=true;inp[k]=1;}
  if((e.code==='KeyJ'||e.code==='KeyX')&&!e.repeat)wavePressed=true;
});

function zoneOf(p){

  return null;}

  if(a&&!tch.a)jumpPressed=true;tch.l=l;tch.r=r;tch.a=a;}
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();audioInit();try{cv.setPointerCapture(e.pointerId);}catch(_){}

  if(S.state!=='play'||S.paused){for(const b of BTNS)if(p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h){b.fn();return;}if(S.state==='title'&&SAVE.unlocked===0)startNew();return;}
  if(p.y<17&&p.x>150){S.paused=true;return;}

},{passive:false});

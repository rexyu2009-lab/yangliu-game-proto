function buildLevel(){
  let NC=0;for(const s of SEQ)NC+=TPL[s[0]][0].length;
  const grid=[];for(let r=0;r<ROWS;r++)grid.push(new Array(NC).fill('.'));
  const L={grid,NC,bubbles:[],fakes:[],items:[],lights:[],cross:[],smokes:[],posters:[],events:[],zoneX:[],goal:0,blockC:{}};
  let x0=0;
  SEQ.forEach(([name,zone,evs])=>{
    const t=TPL[name],w=t[0].length;
    if(L.zoneX.length<=zone)L.zoneX.push(x0*TS);
    (evs||[]).forEach(e=>L.events.push({x:x0*TS,e,done:0}));
    if(L.zoneX.length-1===zone&&L.zoneX[zone]===x0*TS&&zone>0)L.events.push({x:x0*TS,e:['zone',zone],done:0});
    for(let j=0;j<9;j++)for(let i=0;i<w;i++){const ch=(t[j][i]||'.'),r=8+j,c=x0+i,X=c*TS,Y=r*TS;
      if(SOLID.includes(ch))grid[r][c]=ch;
      else if(ch==='o'||ch==='g')L.bubbles.push({x:X+5,y:Y+5,g:ch==='g'});
      else if(ch==='f'||ch==='F')L.fakes.push({x:X,y:Y,w:10,h:10,vx:-14,fly:ch==='F',by:Y,bx:X,dead:0});
      else if(ch==='b')L.items.push({t:'bottle',x:X+5,y:Y+5});
      else if(ch==='L')L.lights.push({x:X+5,y:Y+TS,lit:0,i:L.lights.length});
      else if(ch==='Z')L.cross.push({x:X,w:50,state:'wait',t:0,peds:[0,1,2].map(i=>({s:i,d:-i*.45,p:0}))});
      else if(ch==='S')L.smokes.push({x:X,w:80,hit:0});
      else if(ch==='P')L.posters.push({x:X,y:Y-14,hit:0});
      else if(ch==='E')L.goal=X+5;

  return L;
}

function newRun(){
  const L=buildLevel();
  G=Object.assign(L,{time:0,camX:0,hp:3,inv:0,wave:START_WAVE,bub:0,gold:0,popped:0,stomps:0,lit:0,badges:0,hits:0,falls:0,
    p:{x:30,y:147,w:8,h:13,vx:0,vy:0,boost:0,face:0,onG:false,coy:0,jbuf:0,anim:0,runT:0},cp:{x:30,y:147},
    waves:[],parts:[],toasts:[],story:[],cur:null,freeze:0,respawnAt:null,cane:false,ended:false,endT:0,
    convoy:0,convoyOn:false,convoyHits:0,convoyEgg:false,trail:[],zone:0,crew:String(Math.floor(Math.random()*90000)+10000),
    posterEgg:false,bumps:[],inSmoke:false,smokeNote:0,waveCD:0,waveFlash:0});
}
const inp={left:0,right:0,jump:0,dash:0};let jumpPressed=false,wavePressed=false;
const tch={l:false,r:false,rT:0,a:false,b:0,ptr:new Map()};
function toast(text,kind,dur){G.toasts.push({text,kind:kind||'info',t:0,dur:dur||2.2});}
function say(who,text,dur){G.story.push({who,text,t:0,dur:dur||Math.max(3.4,text.length*.17)});}
function hint(o){say('提示',S.touch?o.tc:o.kb,3.6);}
function burst(x,y,col,n,sp){for(let i=0;i<(n||8);i++){const a=Math.random()*Math.PI*2,v=(sp||40)*(.4+Math.random()*.8);G.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-20,t:0,life:.4+Math.random()*.3,col});}}
function addWave(v){G.wave=clamp(G.wave+v,START_WAVE,1000);if(v>0)G.waveFlash=.25;}
const tile=(c,r)=>{if(c<0||c>=G.NC)return '#';if(r<0||r>=ROWS)return '.';return G.grid[r][c];};
const solidAt=(x,y)=>SOLID.includes(tile(Math.floor(x/TS),Math.floor(y/TS)));

/* ================= 物理 ================= */
const GRAV=900,MAXF=420,RUN=80,DASH=112,JV=295,JV_CUR=340;
function moveX(o,dx){o.x+=dx;const r0=Math.floor(o.y/TS),r1=Math.floor((o.y+o.h-.01)/TS);
  if(dx>0){const c=Math.floor((o.x+o.w-.01)/TS);for(let r=r0;r<=r1;r++)if(SOLID.includes(tile(c,r))){o.x=c*TS-o.w;return true;}}
  else if(dx<0){const c=Math.floor(o.x/TS);for(let r=r0;r<=r1;r++)if(SOLID.includes(tile(c,r))){o.x=(c+1)*TS;return true;}}
  return false;}
function moveY(o,dy,isP){o.y+=dy;const c0=Math.floor(o.x/TS),c1=Math.floor((o.x+o.w-.01)/TS);
  if(dy>0){const r=Math.floor((o.y+o.h-.01)/TS);for(let c=c0;c<=c1;c++){const t=tile(c,r);if(SOLID.includes(t)){o.y=r*TS-o.h;o.vy=0;o.onG=true;o.gt=t;return;}}}
  else if(dy<0){const r=Math.floor(o.y/TS);const mid=Math.floor((o.x+o.w/2)/TS);const order=[mid,c0,c1];for(const c of order){if(SOLID.includes(tile(c,r))){o.y=(r+1)*TS;o.vy=0;if(isP)bonk(c,r);return;}}}
}
function bonk(c,r){
  const t=G.grid[r][c];G.bumps.push({c,r,t:0});SFX.bonk();
  const X=c*TS+5,Y=r*TS;
  if(t==='?'){G.grid[r][c]='u';G.bub++;addWave(.9);SFX.bubble();G.parts.push({x:X,y:Y-6,vx:0,vy:-90,t:0,life:.45,spr:'bub'});}
  else if(t==='Q'){G.grid[r][c]='u';G.gold++;addWave(6);SFX.gold();G.parts.push({x:X,y:Y-6,vx:0,vy:-90,t:0,life:.5,spr:'gold'});}
  else if(t==='C'){G.grid[r][c]='u';G.items.push({t:'cane',x:X,y:Y+6,rise:16,o:{x:X-3,y:Y-2,w:6,h:16,vy:0}});SFX.item();}
  else if(t==='B'&&G.cane){G.grid[r][c]='.';burst(X,Y+5,'r',10,60);SFX.pop();}
  for(const f of G.fakes)if(!f.dead&&Math.abs(f.x+5-X)<10&&Math.abs(f.y+f.h-Y)<3){popFake(f,true);}
}
function popFake(f,stomp){f.dead=1;if(stomp)G.stomps++;else G.popped++;addWave(3);SFX.pop();burst(f.x+5,f.y+5,'p',10);burst(f.x+5,f.y+5,'W',5);}
function jumpNow(p){p.vy=-(p.boost>10?JV_CUR:JV)*(G.inSmoke?.85:1);p.coy=0;p.jbuf=0;p.onG=false;SFX.jump();}
function respawn(){const p=G.p;p.x=G.cp.x;p.y=G.cp.y-30;p.vx=0;p.vy=0;p.boost=0;G.hp=3;G.inv=2;G.trail=[];G.camX=clamp(p.x-PX_LEFT,0,G.NC*TS-W);}

/* ================= 更新 ================= */
function fire(){if(!G||G.waveCD>0||G.ended||G.freeze>0)return;G.waveCD=.35;const p=G.p;const d=p.face?-1:1;
  G.waves.push({x:p.x+4+d*6,y:p.y+6,vx:d*170,dist:0,max:G.cane?78:42,r:G.cane?8:5});SFX.wave();}
function update(dt){
  S.t+=dt;if(S.state!=='play'||S.paused)return;
  if(S.bot)botInput();
  const p=G.p;
  if(!G.ended)G.time+=dt;
  G.inv=Math.max(0,G.inv-dt);G.waveCD=Math.max(0,G.waveCD-dt);G.waveFlash=Math.max(0,G.waveFlash-dt);
  if(tch.r)tch.rT+=dt;else tch.rT=0;
  const L=inp.left||tch.l,Rt=inp.right||tch.r,J=inp.jump||tch.a,D=inp.dash||tch.rT>.8;
  // 掉落重生
  if(G.freeze>0){G.freeze-=dt;if(G.freeze<=0&&G.respawnAt){G.respawnAt=null;respawn();}jumpPressed=wavePressed=false;stepMisc(dt);return;}
  if(jumpPressed){p.jbuf=.13;}jumpPressed=false;
  if(wavePressed)fire();wavePressed=false;
  // 煙霧
  G.inSmoke=G.smokes.some(s=>p.x+4>s.x&&p.x+4<s.x+s.w);
  for(const s of G.smokes)if(!s.hit&&p.x+4>s.x){s.hit=1;if(G.smokeNote++<1)toast('鞭炮煙霧：慢慢走～','warn',1.8);}
  // 水平
  let dir=0;if(!G.ended){if(L&&!Rt)dir=-1;if(Rt&&!L)dir=1;}
  let max=(D?DASH:RUN)*(G.inSmoke?.45:1);
  const acc=p.onG?700:480;
  if(dir){p.vx+=dir*acc*dt;p.face=dir<0?1:0;}else{const f=(p.onG?900:200)*dt;p.vx=Math.abs(p.vx)<=f?0:p.vx-Math.sign(p.vx)*f;}
  p.vx=clamp(p.vx,-max,max);
  if(p.onG&&p.gt==='>')p.boost=Math.min(46,p.boost+200*dt);else if(p.onG)p.boost=Math.max(0,p.boost-160*dt);else p.boost=Math.max(0,p.boost-25*dt);
  if(G.inSmoke)p.boost=Math.min(p.boost,10);
  if(G.ended){p.vx=0;p.boost=0;const tx=G.goal-4;p.x+=clamp(tx-p.x,-40*dt,40*dt);}
  // 斑馬線：行人通過中，走進斑馬線不會被擋，但行人會停下
  if(moveX(p,(p.vx+p.boost)*dt)){p.vx=0;}
  if(p.x<G.camX)p.x=G.camX;
  if(p.x>G.NC*TS-p.w-2)p.x=G.NC*TS-p.w-2;
  // 垂直
  p.coy=p.onG?.1:Math.max(0,p.coy-dt);p.jbuf=Math.max(0,p.jbuf-dt);
  if(p.jbuf>0&&p.coy>0&&!G.ended)jumpNow(p);
  let g=GRAV;if(p.vy<0&&!J)g*=2.6;
  p.vy=Math.min(MAXF,p.vy+g*dt);
  p.onG=false;moveY(p,p.vy*dt,true);
  if(p.y<-20){p.y=-20;p.vy=Math.max(p.vy,0);}
  if(p.y>PFH+20&&!G.respawnAt){G.falls++;(G.fallX=G.fallX||[]).push(Math.round(p.x));G.respawnAt=1;G.freeze=1.1;SFX.fall();toast('掉下去了！粉撲們把你拉回燈塔','warn',1.8);}
  p.anim+=dt*(Math.abs(p.vx+p.boost)>5?12:0);
  // 鏡頭（玩家在左三分之一）
  const target=clamp(p.x-PX_LEFT,0,G.NC*TS-W);G.camX+=(target-G.camX)*Math.min(1,dt*6);if(target>G.camX+40)G.camX=target-40;
  // 軌跡（機車隊跟隨）
  G.trail.unshift({x:p.x,y:p.y});if(G.trail.length>90)G.trail.pop();
  // 泡泡
  for(const b of G.bubbles){if(b.got)continue;if(Math.abs(b.x-(p.x+4))<8&&Math.abs(b.y-(p.y+6))<10){b.got=1;if(b.g){G.gold++;addWave(6);SFX.gold();burst(b.x,b.y,'y',12);}else{G.bub++;addWave(.9);SFX.bubble();burst(b.x,b.y,'l',5,25);}}}
  // 假訊息
  for(const f of G.fakes){if(f.dead)continue;if(f.x>G.camX+W+40||f.x<G.camX-60)continue;
    if(f.fly){f.t=(f.t||0)+dt;f.x+=f.vx*dt;if(Math.abs(f.x-f.bx)>28)f.vx*=-1;f.y=f.by+Math.sin(f.t*2.5)*9;}
    else{f.vy=Math.min(MAXF,(f.vy||0)+GRAV*dt);if(moveX(f,f.vx*dt))f.vx*=-1;
      const ahead=f.vx>0?f.x+f.w+1:f.x-1;if(f.onG&&!solidAt(ahead,f.y+f.h+2))f.vx*=-1;f.onG=false;moveY(f,f.vy*dt,false);if(f.y>PFH+20)f.dead=1;}
    if(p.x<f.x+f.w&&p.x+p.w>f.x&&p.y<f.y+f.h&&p.y+p.h>f.y&&!G.ended){
      if(p.vy>0&&p.y+p.h-f.y<8){popFake(f,true);p.vy=J?-300:-200;}
      else if(G.inv<=0)damage(f.x<p.x?1:-1);}}
  // 道具
  for(const it of G.items){if(it.got)continue;
    if(it.o){const o=it.o;if(it.rise>0){o.y-=40*dt;it.rise-=40*dt;}else if(!it.rest){o.vy=Math.min(MAXF,o.vy+GRAV*dt);if(moveX(o,28*dt))it.rest=1;o.onG=false;moveY(o,o.vy*dt,false);if(o.onG&&o.y+o.h>=159)it.rest=1;if(o.y>PFH)it.rest=1;}it.x=o.x+3;it.y=o.y+8;}
    if(Math.abs(it.x-(p.x+4))<9&&Math.abs(it.y-(p.y+6))<12){it.got=1;SFX.item();
      if(it.t==='bottle'){G.hp=Math.min(3,G.hp+1);toast('洋流補給：救生圈 +1','item',1.8);}
      else{G.cane=true;burst(p.x+4,p.y,'g',14);toast('甘蔗寶刀到手！浪花變遠，還能頂破磚塊','item',2.6);say('粉撲','對，甘蔗要站著放！這樣才會步步高升！');}}}
  // 燈塔＝存檔點
  for(const lt of G.lights){if(lt.lit)continue;if(p.x+4>lt.x-6){lt.lit=1;G.lit++;addWave(12);SFX.light();burst(lt.x,PFY*0+lt.y-24,'l',16,50);G.cp={x:lt.x-4,y:lt.y-13};
    toast('政見燈塔 '+G.lit+'/5｜'+POLICIES[lt.i],'policy',2.8);}}
  // 斑馬線
  for(const c of G.cross){
    const stop=c.x-4;
    if(c.state==='wait'&&p.x+p.w>stop-70){c.state='cross';c.t=0;}
    if(c.state==='cross'||c.state==='shake'){
      const inside=p.x+p.w>c.x+2&&p.x<c.x+c.w;
      if(inside&&c.state==='cross'){c.state='shake';c.t=0;c.failed=1;toast('行人停下來搖搖頭……下次停在線前禮讓喔','info',2.2);}
      if(c.state==='shake'){c.t+=dt;if(c.t>1.2&&!inside)c.state='cross';}
      else{c.t+=dt;for(const pd of c.peds){pd.d+=dt;if(pd.d>0)pd.p=Math.min(1,pd.p+dt/1.6);}
        if(c.peds.every(pd=>pd.p>=1)){c.state='done';if(!c.failed){G.badges++;addWave(6);SFX.badge();toast('獲得「禮讓徽章」！謝謝你讓行人先走','badge',2.4);}}}
    }
  }
  // 浪花
  for(const w of G.waves){const s=w.vx*dt;w.x+=s;w.dist+=Math.abs(s);
    for(const f of G.fakes){if(f.dead)continue;if(Math.hypot(f.x+5-w.x,f.y+5-w.y)<w.r+6)popFake(f,false);}
    for(const ps of G.posters){if(!G.posterEgg&&Math.abs(ps.x+6-w.x)<w.r+8){G.posterEgg=true;toast('寧夏第一張海報：「8 月中，一切從這裡開始」','egg',3);SFX.item();}}
    if(solidAt(w.x,w.y))w.dist=w.max;}
  G.waves=G.waves.filter(w=>w.dist<w.max);
  // 機車隊
  if(G.convoyOn)G.convoy=Math.min(2000,Math.round(G.convoy+dt*80));
  // 事件
  for(const ev of G.events){if(ev.done||p.x<ev.x-20)continue;ev.done=1;const e=ev.e;
    if(e[0]==='dlg')say(e[1],e[2]);else if(e[0]==='hint')hint(e[1]);else if(e[0]==='note')say('提示',e[1],3.4);
    else if(e[0]==='zone'){G.zone=e[1];toast('進入　'+ZONES[e[1]],'zone',1.8);}
    else if(e[0]==='convoy'){G.convoyOn=true;G.convoy=1;G.convoyHits=G.hits+G.falls;toast('機車隊集結！跟隨船員持續增加中','info',2.2);}
    else if(e[0]==='convoyEnd'){G.convoyOn=false;G.convoy=2000;if(G.hits+G.falls===G.convoyHits){G.convoyEgg=true;toast('零碰撞！解鎖「機車隊船員裝」（彩蛋）','egg',2.6);}}}
  // 終點
  if(!G.ended&&p.x+4>=G.goal-6){G.ended=true;G.story=[];G.toasts=[];say('沈伯洋','剛剛車多、鞭炮也吵，打擾到街坊，真的抱歉。下次我們安靜一點地前進。',4.4);}
  if(G.ended){G.endT+=dt;if(G.endT>4.4&&S.state==='play'){S.state='clear';S.focus=0;SFX.clear();}}
  stepMisc(dt);
}
function stepMisc(dt){
  for(const pt of G.parts){pt.t+=dt;pt.x+=pt.vx*dt;pt.y+=pt.vy*dt;pt.vy+=(pt.spr?260:30)*dt;}
  G.parts=G.parts.filter(pt=>pt.t<pt.life);
  for(const b of G.bumps)b.t+=dt;G.bumps=G.bumps.filter(b=>b.t<.16);
  if(G.toasts.length){const t=G.toasts[0];t.t+=dt*(G.toasts.length>2?1.8:1);if(t.t>t.dur)G.toasts.shift();}
  if(!G.cur&&G.story.length)G.cur=G.story.shift();
  if(G.cur){G.cur.t+=dt*(G.story.length>1?1.6:1);if(G.cur.t>G.cur.dur)G.cur=null;}
}
function damage(dir){
  G.hits++;G.hp--;G.inv=1.3;SFX.hit();const p=G.p;p.vx=dir*90;p.vy=-160;burst(p.x+4,p.y+6,'R',10);
  if(G.hp<=0){G.respawnAt=1;G.freeze=1.1;toast('救生圈用完了！粉撲們把你拉回燈塔','warn',2);}
}

/* ================= 自動駕駛（測試用：?bot=1） ================= */
let botJ=0;
function botInput(){
  const p=G.p;inp.left=0;inp.right=1;inp.dash=0;
  const fx=p.x+p.w,feet=p.y+p.h;
  for(const c of G.cross){if((c.state==='cross')&&fx>c.x-75&&fx<c.x-2)inp.right=0;}
  const look=4+Math.abs(p.vx+p.boost)*.06;
  const wall=solidAt(fx+look,feet-3)||solidAt(fx+look,feet-11);
  const pit=p.onG&&!solidAt(fx+4,feet+4);
  const enemy=G.fakes.find(f=>!f.dead&&!f.fly&&f.x-fx>-4&&f.x-fx<34&&Math.abs(f.y-p.y)<16);
  if(enemy&&G.waveCD<=0)fire();
  if(inp.right&&p.onG&&(wall||pit||(enemy&&enemy.x-fx<14))){jumpPressed=true;botJ=.3;}
  if(botJ>0){botJ-=1/60;inp.jump=1;}else inp.jump=0;
}

/* ================= 繪圖：場景 ================= */
const nightAt=x=>G&&G.zoneX[3]!==undefined?clamp((x-G.zoneX[3]+120)/240,0,1):0;
const SKY=[['c','w'],['c','w'],['w','c'],['k','D'],['k','D'],['k','D']];
function drawScene(){
  const b=bx,cam=Math.round(G.camX),T=S.t;
  b.save();b.beginPath();b.rect(0,PFY,W,PFH);b.clip();b.translate(0,PFY);
  const zc=zoneAtX(cam+90),night=nightAt(cam+90);
  // 天空
  const sk=SKY[zc];R(b,0,0,W,PFH,sk[0]);for(let y=0;y<60;y+=6)R(b,0,y,W,3,sk[1]);
  if(night<.5)for(let i=0;i<6;i++){const cx=Math.round(((i*70+hash(i,9)*40-cam*.1)%420+420)%420-60),cy=12+hash(i,2)*50;R(b,cx,cy,26,6,'W');R(b,cx+5,cy-4,14,4,'W');R(b,cx+2,cy+6,22,1,'w');}
  if(night>.3)for(let i=0;i<14;i++){const sx=Math.floor((hash(i,3)*260-cam*.05)%200+200)%200-10;R(b,sx,hash(i,5)*60,1,1,Math.floor(T*2+i)%5?'W':'l');}
  // 遠景（視差 .25）
  for(let i=Math.floor(cam*.25/30)-1;i<Math.floor(cam*.25/30)+8;i++){const sx=i*30-cam*.25;const z=zoneAtX(i*30/.25);const h=hash(i,17);
    if(z<=1){const hh=30+h*30;R(b,sx,140-hh,32,hh,z?'g':'D');R(b,sx+6,140-hh-6,20,6,z?'g':'D');}
    else if(z===2||z===4){const hh=40+h*50;R(b,sx,150-hh,26,hh,z===4?'n':'G');for(let wy=150-hh+5;wy<145;wy+=8)for(let wx=3;wx<22;wx+=7)R(b,sx+wx,wy,3,4,night>.4?'l':'c');}
    else if(z===3){const hh=30+h*30;R(b,sx,150-hh,28,hh,'D');R(b,sx+12,150-hh-15,2,15,'G');}
    else{R(b,sx,110,30,40,'n');}}
  // 近景（視差 .6）
  const lights=[];
  for(let i=Math.floor(cam*.6/24)-1;i<Math.floor(cam*.6/24)+10;i++){const sx=Math.round(i*24-cam*.6);const z=zoneAtX(i*24/.6);const h=hash(i,23);
    if(z===0){if(h<.5){R(b,sx+4,150,14,10,'c');for(let s=0;s<3;s++){b.fillStyle='rgba(255,244,224,.55)';b.fillRect(Math.round(sx+6+s*4+Math.sin(T+s+i)*2),Math.round(146-((T*12+s*7+i*3)%26)),3,3);}}else{R(b,sx+8,138,8,22,'n');R(b,sx+2,126,20,14,'g');R(b,sx+5,123,14,4,'g');}}
    else if(z===1){R(b,sx,152,24,8,'b');R(b,sx+(T*10%24),155,4,1,'w');if(h<.5){R(b,sx+10,136,3,16,'n');R(b,sx+4,124,15,13,'g');}}
    else if(z===2){const col=['y','W','l','G'][Math.floor(h*4)];R(b,sx,112,24,48,col);R(b,sx,112,24,2,'k');for(let wy=118;wy<150;wy+=10){R(b,sx+4,wy,6,6,'k');R(b,sx+5,wy+1,4,4,'c');R(b,sx+14,wy,6,6,'k');R(b,sx+15,wy+1,4,4,'c');}}
    else if(z===3){const aw=h<.5?['R','W']:['o','W'];for(let k=0;k<24;k+=4)R(b,sx+k,128,4,6,aw[(k/4)%2]);R(b,sx+2,134,20,26,'n');R(b,sx+3,140,18,10,'y');R(b,sx+3,150,18,10,'k');lights.push([sx+4,124,'R'],[sx+18,124,'R']);if(h<.35){R(b,sx+6,141,8,8,'o');R(b,sx+7,143,6,1,'W');}}
    else if(z===4){R(b,sx,108,24,52,'r');R(b,sx,108,24,3,'k');R(b,sx+3,132,8,28,'n');R(b,sx+13,132,8,28,'n');R(b,sx+4,130,6,2,'n');R(b,sx+14,130,6,2,'n');R(b,sx+5,116,14,8,'y');lights.push([sx+12,128,'y']);}
    else{R(b,sx,140,24,20,'y');R(b,sx,140,24,1,'l');}}

function go(st){SFX.ui();S.focus=0;if(st==='crew')newRun();if(st==='play'&&!G)newRun();if(st==='title')G=null;S.state=st;S.paused=false;inp.left=inp.right=inp.jump=inp.dash=0;}

/* ================= 輸入 ================= */
const KM={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',Space:'jump',ArrowUp:'jump',KeyW:'jump',KeyK:'jump',ShiftLeft:'dash',ShiftRight:'dash'};
window.addEventListener('keydown',e=>{
  audioInit();if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code))e.preventDefault();
  if(S.touch&&!e.repeat)S.touch=false;
  if(e.code==='KeyM'){setMute(!S.muted);return;}
  const menu=S.state!=='play'||S.paused;
  if(menu){if(e.repeat)return;const list=BTNS.filter(b=>b.h>=15);
    if(e.code==='ArrowDown'||e.code==='KeyS'||e.code==='Tab'){e.preventDefault();S.focus=(S.focus+1)%Math.max(1,list.length);SFX.ui();}
    else if(e.code==='ArrowUp'||e.code==='KeyW'){S.focus=(S.focus-1+list.length)%Math.max(1,list.length);SFX.ui();}
    else if(e.code==='Enter'||e.code==='Space'||e.code==='KeyJ'){const bt=list[S.focus]||list[0];if(bt)bt.fn();}
    else if((e.code==='Escape'||e.code==='KeyP')&&S.paused)S.paused=false;
    else if(e.code==='KeyR'&&S.paused){newRun();S.paused=false;}
    return;}
  if(e.code==='Escape'||e.code==='KeyP'){S.paused=true;S.focus=0;return;}
  const k=KM[e.code];if(k){if(k==='jump'&&!inp.jump&&!e.repeat)jumpPressed=true;inp[k]=1;}
  if((e.code==='KeyJ'||e.code==='KeyX')&&!e.repeat)wavePressed=true;
});
window.addEventListener('keyup',e=>{const k=KM[e.code];if(k)inp[k]=0;});
window.addEventListener('blur',()=>{inp.left=inp.right=inp.jump=inp.dash=0;tch.l=tch.r=tch.a=false;tch.ptr.clear();if(S.state==='play')S.paused=true;});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S.state==='play')S.paused=true;});
function gpos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};}
function zoneOf(p){ // 觸控區
  if(p.y>=GH-6){if(p.x<44)return 'L';if(p.x<92)return 'R';if(p.x>=138||Math.hypot(p.x-156,p.y-280)<18)return 'A';return 'B';}
  if(p.y>PFY&&p.y<GH){return p.x<90?(p.x<45?'L':'R'):'A';} // 遊戲區也可點（左半移動、右半跳）
  return null;}
function syncTouch(){let l=false,r=false,a=false;for(const z of tch.ptr.values()){if(z==='L')l=true;if(z==='R')r=true;if(z==='A')a=true;}
  if(a&&!tch.a)jumpPressed=true;tch.l=l;tch.r=r;tch.a=a;}
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();audioInit();try{cv.setPointerCapture(e.pointerId);}catch(_){}
  if(e.pointerType==='touch'||e.pointerType==='pen')S.touch=true;
  const p=gpos(e);
  if(S.state!=='play'||S.paused){for(const b of BTNS)if(p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h){b.fn();return;}if(S.state==='title')go('howto');return;}
  if(p.y<17&&p.x>150){S.paused=true;return;}
  const z=zoneOf(p);if(!z)return;
  if(z==='B'){wavePressed=true;tch.bF=.15;return;}
  tch.ptr.set(e.pointerId,z);syncTouch();
},{passive:false});
cv.addEventListener('pointermove',e=>{e.preventDefault();if(!tch.ptr.has(e.pointerId))return;const old=tch.ptr.get(e.pointerId);if(old==='A')return;const p=gpos(e);
  const z=p.x<44?'L':p.x<92?'R':old;tch.ptr.set(e.pointerId,z);syncTouch();},{passive:false});
function ptrEnd(e){if(tch.ptr.delete(e.pointerId))syncTouch();}
cv.addEventListener('pointerup',ptrEnd);cv.addEventListener('pointercancel',ptrEnd);cv.addEventListener('lostpointercapture',ptrEnd);
['touchstart','touchmove','touchend','gesturestart','gesturechange','dblclick','contextmenu'].forEach(ev=>document.addEventListener(ev,e=>{if(e.cancelable)e.preventDefault();},{passive:false}));
document.addEventListener('wheel',e=>{if(e.ctrlKey)e.preventDefault();},{passive:false});

let last=performance.now(),acc=0;const STEP=1/60;
function frame(now){let dt=(now-last)/1000;last=now;if(dt>.25)dt=.25;acc+=dt*(window.__yl.speed||1);
  let n=0;while(acc>=STEP&&n<40){update(STEP);acc-=STEP;n++;if(tch.bF>0)tch.bF-=STEP;}if(n>=40)acc=0;
  render();requestAnimationFrame(frame);}
window.__yl={get S(){return S;},get G(){return G;},speed:Number(QS.get('speed'))||1,go,newRun,
  warpX(x){if(!G)return;G.p.x=x;G.p.y=60;G.camX=clamp(x-PX_LEFT,0,G.NC*TS-W);for(const ev of G.events)if(ev.x<x){ev.done=1;if(ev.e[0]==='zone')G.zone=ev.e[1];}for(const l of G.lights)if(l.x<x){l.lit=1;G.cp={x:l.x-4,y:l.y-13};}},
  setBot(v){S.bot=v;}};
resize();cv.focus();requestAnimationFrame(frame);
})();
